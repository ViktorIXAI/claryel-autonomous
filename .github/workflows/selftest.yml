name: contour self-tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: fixer suite (12 cases incl. refusal paths)
        run: python harness/gate_fixers_test.py
      - name: v1.9 slot-normalizer contract
        run: python harness/gate_v19_d_test.py
      - name: bank & plan-example sanity (178 tasks / 681 positions)
        run: python scripts/sanity_data.py
      - name: privacy-boundary gateway rules
        run: python benchmarks/privacy-boundary/test_gateway.py
      - name: link integrity (all markdown references resolve)
        run: python scripts/check_links.py
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: download pinned artifacts from public release (no auth)
        run: |
          curl -sL -o art.tar.zst \
            https://github.com/${{ github.repository }}/releases/download/contour-v1.9/artifacts-release-2026-11-01-v2.tar.zst
          mkdir -p artifacts && tar --zstd -xf art.tar.zst -C artifacts --strip-components=1
      - name: verify every file against logs/INDEX.md sha256 prefixes
        run: python scripts/verify_release_hashes.py artifacts
      - name: recompute aggregates from raw rows and diff vs published summary
        run: |
          PARB_ARTIFACTS=artifacts python analytics/aggregate.py > recomputed.json
          python scripts/diff_summary.py recomputed.json results/summary.json
