name: hard-v6 scoring contracts
# Issue #7: scoring modes must not drift silently. Every contour gate contract, the
# frozen bank/scorer pins, and an independent re-score of the published hard-v6 arms run
# on every push and PR. Category-E sandbox re-execution is deliberately not here: it needs
# a docker sandbox and is run locally on an idle host (`--include-exec`).
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: contour gate contracts (repair pipeline, loop drive, K bool, H json)
        run: |
          for f in harness/gate_v36_format_repair_test.py harness/gate_v37_loop_drive_test.py \
                   harness/gate_v38_repair_pipeline_test.py harness/gate_v39_k_bool_test.py \
                   harness/gate_v40_h_json_test.py harness/gate_v44_coverage_choice_test.py \
                   harness/gate_v45_stamp_guard_test.py harness/gate_v46_format_guarantee_test.py \
                   harness/gate_v47_selfconsistency_test.py harness/gate_v48_j_rerank_test.py \
                   harness/gate_v49_feature_adoption_test.py harness/gate_v50_a_tariff_test.py \
                   harness/gate_v51_b_fields_test.py                   harness/gate_v52_b_table_test.py \
                   harness/gate_v53_g4_lottery_test.py \
                   harness/gate_v54_j_membership_test.py \
                   harness/gate_versioning_test.py; do
            echo "=== $f"; python3 "$f"
          done
      - name: bank shape - dedup guard and C answer-position distribution (issue #15)
        run: |
          python3 scripts/dedup_hard_bank.py benchmarks/hard/bank-hard-v6.json
          python3 scripts/c_positions.py
      # v5 is knowingly defective (issue #14/#15 found byte-identical prompts behind 77 ids).
      # The guard documents that fact in CI; it must not gate the pipeline, because the v5
      # artifacts are frozen history that no run may rewrite.
      - name: v5 duplicate audit (documented defect, not a gate)
        continue-on-error: true
        run: python3 scripts/dedup_hard_bank.py benchmarks/hard/bank-hard-v5.json
      - name: frozen bank/scorer pins
        run: |
          python3 harness/verify_manifest.py --v5
          python3 harness/verify_manifest.py --v6
      - name: independent re-score of published arms (issue #6)
        run: python3 scripts/rescore_all_arms.py
      - name: corrected plain-D column is reproducible
        run: python3 scripts/rescore_v6_cells.py
      - name: link integrity
        run: python3 scripts/check_links.py
