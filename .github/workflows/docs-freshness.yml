name: docs-freshness
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  daily-docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public docs are current and simple
        run: python scripts/qa/docs_policy.py --daily
