name: devsecops
on: [push, pull_request]
permissions:
  contents: read

jobs:
  json-schema-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON, JSONL and public schemas
        run: python scripts/qa/validate_json.py

  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 so /commit/<sha> documentation links resolve against
          # real local history instead of a network guess (scripts/check_links.py)
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all repository static QA gates
        run: python scripts/qa/static_checks.py

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce pinned runtime dependencies
        run: python scripts/devsecops/dependency_policy.py

  release-asset-validation:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan every release asset for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fL -o "$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$url"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64 > "$RUNNER_TEMP/gitleaks.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c gitleaks.sha256)
          tar -xzf "$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" -D assets || true
          GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" python scripts/security/secret_scan.py \
            --dir assets --strict --report "$RUNNER_TEMP/release-assets.json"

          echo "Release asset scan passed; raw scanner reports are not uploaded."
