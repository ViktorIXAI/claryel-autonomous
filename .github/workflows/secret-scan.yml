name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tarball="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fL -o "$tarball" "$url"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64 > "$RUNNER_TEMP/gitleaks.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c gitleaks.sha256)
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

      - name: Scanner self-test
        run: '"$GITLEAKS_BIN" version && python3 scripts/security/secret_scan.py --selftest --report "$RUNNER_TEMP/gitleaks-selftest.json"'

      - name: Scan current checkout
        run: 'python3 scripts/security/secret_scan.py --dir . --strict --report "$RUNNER_TEMP/gitleaks-current.json"'

      # Historical metadata may remain public when history is intentionally
      # preserved. This report is non-blocking; credential findings in current
      # code still fail the job above.
      - name: Report all branches and tags
        continue-on-error: true
        run: '"$GITLEAKS_BIN" git . -c .gitleaks.toml --redact --no-banner --exit-code 1'

      - name: Fail current-branch scan with sanitized summary only
        if: failure()
        run: |
          echo "Secret scanning failed on the current code. Raw reports are not uploaded."
          echo "A maintainer must run scripts/security/secret_scan.py locally and inspect the private report."
          exit 1
