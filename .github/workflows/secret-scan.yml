name: secret-scan
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fL -o "$tarball" "$url"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64 > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "$tarball" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scanner self-test
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/gitleaks
        run: ./gitleaks version && python3 scripts/security/secret_scan.py --selftest --report /tmp/gitleaks-selftest.json

      - name: Scan current checkout
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/gitleaks
        run: python3 scripts/security/secret_scan.py --dir . --strict --report /tmp/gitleaks-current.json

      # Historical metadata may remain public when history is intentionally
      # preserved. This report is non-blocking; credential findings in current
      # code still fail the job above.
      - name: Report all branches and tags
        continue-on-error: true
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/gitleaks
        run: ./gitleaks git . -c .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Fail current-branch scan with sanitized summary only
        if: failure()
        run: |
          echo "Secret scanning failed on the current code. Raw reports are not uploaded."
          echo "A maintainer must run scripts/security/secret_scan.py locally and inspect the private report."
          exit 1
