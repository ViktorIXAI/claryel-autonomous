# Motion 4.6 configuration for the tavern light controller (claryel01).
# [EN] Detection only: no videos, no pictures, no web stream, no control interface.
#      640x480 @ 2 fps is the smallest mode this UVC camera offers (it does not expose
#      320x240), chosen to keep CPU/RAM minimal. Options verified against the motion
#      4.6.0-1ubuntu2 binary in Ubuntu 24.04.
# [RU] Только обнаружение: без видео, фото, веб-трансляции и интерфейса управления.
#      640x480 @ 2 к/с — минимальный режим этой UVC-камеры (320x240 она не отдаёт),
#      чтобы нагрузка на CPU/RAM была минимальной. Имена опций сверены с бинарником
#      motion 4.6.0-1ubuntu2 из Ubuntu 24.04.

# --- runtime (systemd keeps it in the foreground; logs go to journald) ---
daemon off
log_level 6
quiet on
setup_mode off
target_dir /tmp/motion-tavern

# --- local USB camera (V4L2) ---
video_device /dev/video0
width 640
height 480
framerate 2
minimum_frame_time 0.5
auto_brightness off
roundrobin_frames 1
roundrobin_skip 1

# --- detection ---
# [EN] threshold = minimum number of changed pixels that counts as motion (frame is
#      640x480 = 307200 px).  noise_level is the per-pixel difference that is still
#      treated as sensor noise; this cheap UVC camera is very noisy in the dark, so it is
#      raised well above the default 8.  despeckle_filter removes isolated noise pixels.
#      minimum_motion_frames 3 = motion must be present on 3 consecutive frames (1.5 s).
#      lightswitch_percent/lightswitch_frames make Motion ignore a global brightness jump
#      (the tavern light switching on or off) for the given number of frames.
# [RU] threshold = минимум изменившихся пикселей (кадр 640x480 = 307200 пикселей).
#      noise_level = порог, ниже которого разница пикселя считается шумом сенсора; для этой
#      дешёвой UVC-камеры в темноте шум очень большой, поэтому значение заметно выше
#      дефолтного 8. despeckle_filter убирает одиночные шумовые пиксели.
#      minimum_motion_frames 3 = движение должно быть на 3 кадрах подряд (1,5 с).
#      lightswitch_percent/lightswitch_frames заставляют Motion игнорировать глобальную
#      смену яркости (включение и выключение света в таверне) несколько кадров.
threshold 2000
threshold_tune off
noise_level 20
noise_tune off
despeckle_filter EedDl
minimum_motion_frames 3
event_gap 15
lightswitch_percent 30
lightswitch_frames 3
area_detect off
smart_mask_speed 0

# --- everything that writes or serves data is off ---
picture_output off
movie_output off
movie_duplicate_frames off
stream_port 0
webcontrol_port 0
webcontrol_interface 0
webcontrol_parms 0

# --- Home Assistant bridge (local REST only) ---
on_event_start /home/viktor/.local/libexec/tavern-motion-hook.sh start
on_motion_detected /home/viktor/.local/libexec/tavern-motion-hook.sh frame
on_event_end /home/viktor/.local/libexec/tavern-motion-hook.sh end
on_camera_lost /home/viktor/.local/libexec/tavern-motion-hook.sh failure
