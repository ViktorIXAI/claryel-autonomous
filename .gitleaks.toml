# Gitleaks configuration for public experiment publication.
# Built-in credential detectors are enabled; custom rules cover internal
# infrastructure metadata. This file intentionally contains generic patterns
# and never hard-codes host users, addresses, key names or account identifiers.
title = "Claryel Autonomous publication secret policy"

[extend]
useDefault = true

[allowlist]
description = "Known placeholders and synthetic test fixtures"
regexes = [
  '''\[REDACTED\]''',
  '''\\$\\{[A-Z0-9_]+\\}''',
  '''<[^<>]+-(?:key|token|password|secret|user|host)>''',
  '''example\\.(?:com|org|net)''',
  '''invalid\\b''',
  '''evil-inbox\\.example''',
  '''gitleaks:allow''',
  '''/home/runner/''',  # gitleaks:allow public GitHub CI path
]
paths = [
  '''scripts/publish/publish\.env\.example''',
  '''scripts/terminal_bench/publish_run\.py''',
  '''config\.example\.sh''',
  '''(^|/)\.venv/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.git/''',
]

[[rules]]
id = "private-network-address"
description = "Private local network address"
regex = '''\b(?:10(?:\.[0-9]{1,3}){3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b'''
keywords = ["192.168", "10.", "172."]

[[rules]]
id = "local-account-path"
description = "Absolute local account path"
regex = '''(?:/home/[A-Za-z0-9_.-]+|/Users/[A-Za-z0-9_.-]+|C:\\\\Users\\\\[A-Za-z0-9_.-]+)'''
keywords = ["/home/", "/Users/", "Users\\"]

[[rules]]
id = "ssh-connection-material"
description = "SSH user, host or private-key path"
regex = '''(?:ssh\s+-i\s+\S+|ssh\s+[A-Za-z0-9_.-]+@(?:[0-9]{1,3}\.){3}[0-9]{1,3}|\.ssh/[A-Za-z0-9_.-]+\.key)'''
keywords = ["ssh -i", ".ssh/", "@10.", "@192.", "@172."]

[[rules]]
id = "local-environment-dump"
description = "Environment variables that can contain credentials"
regex = '''(?i)^\s*(?:AWS_SECRET_ACCESS_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY|HASS_TOKEN|HOME_ASSISTANT_TOKEN|GITHUB_TOKEN|API_KEY|ACCESS_TOKEN|PRIVATE_TOKEN)\s*[:=]'''
keywords = ["AWS_SECRET", "OPENAI_API", "ANTHROPIC_API", "HASS_TOKEN", "HOME_ASSISTANT_TOKEN", "GITHUB_TOKEN", "API_KEY"]
